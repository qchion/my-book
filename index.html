<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 온라인 책</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light dark;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background: Canvas;
      color: CanvasText;
    }

    header {
      min-height: 64px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
    }

    .book-info {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.72;
    }

    a.button {
      flex: none;
      padding: 9px 12px;
      border: 1px solid currentColor;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      font-size: 13px;
    }

    main {
      flex: 1;
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #525659;
    }

    .fallback {
      padding: 24px;
    }

    @media (max-width: 560px) {
      header {
        min-height: 56px;
        padding: 8px 12px;
      }

      h1 { font-size: 15px; }
      p { display: none; }

      a.button {
        padding: 7px 9px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="book-info">
      <!-- 아래 제목과 저자명을 수정하세요. -->
      <h1>책 제목을 입력하세요</h1>
      <p>저자명을 입력하세요</p>
    </div>
    <a class="button" href="book.pdf" target="_blank" rel="noopener">
      PDF 새 창
    </a>
  </header>

  <main>
    <!-- PDF 파일 이름은 반드시 book.pdf로 맞추세요. -->
    <iframe
      src="book.pdf#page=1&zoom=page-width"
      title="온라인 책 PDF 뷰어">
      <div class="fallback">
        PDF를 표시할 수 없습니다.
        <a href="book.pdf">여기에서 PDF를 여세요.</a>
      </div>
    </iframe>
  </main>
</body>
</html>
