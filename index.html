<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>책 열기</title>

  <!-- 자바스크립트가 막힌 브라우저에서도 PDF로 이동 -->
  <meta http-equiv="refresh" content="0; url=https://qchion.github.io/my-book/book.pdf">

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    main {
      width: min(100%, 420px);
      padding: 28px 22px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    p {
      margin: 0 0 20px;
      line-height: 1.6;
      color: #555;
    }

    a {
      display: block;
      width: 100%;
      padding: 15px 16px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>

  <script>
    // iframe을 사용하지 않고 현재 창 전체를 PDF 주소로 변경
    window.location.replace("https://qchion.github.io/my-book/book.pdf");
  </script>
</head>
<body>
  <main>
    <h1>PDF 책 열기</h1>
    <p>
      자동으로 열리지 않으면 아래 버튼을 누르세요.
      아이폰에서는 Safari에서 여는 것이 가장 안정적입니다.
    </p>
    <a href="https://qchion.github.io/my-book/book.pdf">책 전체 열기</a>
  </main>
</body>
</html>
