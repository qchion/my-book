<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vakil AG Bearbeitung</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #525659;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .fallback {
      padding: 24px;
      background: white;
      color: black;
    }
  </style>
</head>
<body>
  <iframe
    src="book.pdf#page=1&zoom=page-width"
    title="온라인 PDF 책">
    <div class="fallback">
      PDF를 표시할 수 없습니다.
      <a href="book.pdf">PDF 직접 열기</a>
    </div>
  </iframe>
</body>
</html>
