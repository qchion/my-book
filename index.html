<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Vakil AG Bearbeitung</title>
  <style>
    :root {
      --toolbar-h: 58px;
      --sidebar-w: 270px;
      --bg: #e5e7eb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #111827;
      --muted: #64748b;
      --line: #cbd5e1;
      --button: #ffffff;
      --button-hover: #eef2f7;
      --accent: #2563eb;
      --shadow: 0 5px 20px rgba(15, 23, 42, .18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --panel-2: #172033;
        --text: #f8fafc;
        --muted: #94a3b8;
        --line: #475569;
        --button: #273449;
        --button-hover: #34445e;
        --accent: #60a5fa;
        --shadow: 0 5px 22px rgba(0, 0, 0, .45);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input {
      font: inherit;
    }

    button, a.tool-button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    button:hover, a.tool-button:hover {
      background: var(--button-hover);
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 1px;
    }

    #app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: var(--toolbar-h) minmax(0, 1fr);
    }

    #toolbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    .divider {
      width: 1px;
      height: 30px;
      background: var(--line);
      flex: none;
    }

    #bookTitle {
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
      padding: 0 4px;
    }

    #pageInput {
      width: 58px;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      background: var(--panel-2);
      color: var(--text);
    }

    #searchInput {
      width: 185px;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      background: var(--panel-2);
      color: var(--text);
    }

    #zoomLabel, #pageTotal, #searchStatus {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    #content {
      min-height: 0;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    }

    #sidebar {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: var(--panel);
      z-index: 15;
    }

    #sidebarTabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 8px;
      border-bottom: 1px solid var(--line);
    }

    #sidebarTabs button[aria-selected="true"] {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .side-panel {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 10px;
    }

    .side-panel[hidden] { display: none; }

    #thumbs {
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .thumb {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 6px;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .thumb:hover {
      background: var(--button-hover);
    }

    .thumb.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .thumb canvas {
      display: block;
      max-width: 150px;
      max-height: 210px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .24);
    }

    .thumb span {
      font-size: 12px;
      color: var(--muted);
    }

    #outline {
      font-size: 14px;
    }

    #outline ul {
      list-style: none;
      margin: 0;
      padding-left: 14px;
    }

    #outline > ul {
      padding-left: 0;
    }

    #outline button {
      display: block;
      width: 100%;
      min-height: 30px;
      padding: 5px 7px;
      border: 0;
      background: transparent;
      text-align: left;
      white-space: normal;
      line-height: 1.35;
    }

    #outline button:hover {
      background: var(--button-hover);
    }

    #outline .empty,
    #loadingMessage {
      color: var(--muted);
      padding: 14px;
      line-height: 1.6;
    }

    #viewerPane {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--bg);
    }

    #pageStage {
      position: relative;
      margin: 22px auto 50px;
      background: #fff;
      box-shadow: var(--shadow);
      transform-origin: top center;
    }

    #pdfCanvas {
      position: absolute;
      inset: 0;
      display: block;
      background: #fff;
    }

    #textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      line-height: 1;
      opacity: 1;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      transform-origin: 0 0;
    }

    #textLayer span {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: text;
      transform-origin: 0 0;
    }

    #textLayer span.search-hit {
      background: rgba(250, 204, 21, .45);
      border-radius: 2px;
    }

    #textLayer ::selection {
      background: rgba(37, 99, 235, .35);
    }

    #statusOverlay {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      z-index: 10;
      max-width: calc(100% - 30px);
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 14px;
      text-align: center;
    }

    #statusOverlay[hidden] { display: none; }

    #mobileShade {
      display: none;
    }

    @media (max-width: 800px) {
      :root { --toolbar-h: 56px; }

      #bookTitle, .desktop-only, .divider.optional {
        display: none;
      }

      #content {
        grid-template-columns: minmax(0, 1fr);
      }

      #sidebar {
        position: fixed;
        top: var(--toolbar-h);
        bottom: 0;
        left: 0;
        width: min(82vw, 310px);
        transform: translateX(-105%);
        transition: transform .18s ease;
        box-shadow: var(--shadow);
      }

      body.sidebar-open #sidebar {
        transform: translateX(0);
      }

      #mobileShade {
        display: block;
        position: fixed;
        z-index: 14;
        inset: var(--toolbar-h) 0 0 0;
        border: 0;
        border-radius: 0;
        background: rgba(0, 0, 0, .45);
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s ease;
      }

      body.sidebar-open #mobileShade {
        opacity: 1;
        pointer-events: auto;
      }

      #searchInput {
        width: 150px;
      }

      #pageStage {
        margin-top: 12px;
      }
    }

    @media print {
      #toolbar, #sidebar, #mobileShade, #statusOverlay { display: none !important; }
      #app, #content, #viewerPane { display: block; overflow: visible; height: auto; }
      #pageStage { margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="toolbar" aria-label="PDF 도구 모음">
      <div class="group">
        <button id="sidebarToggle" type="button" aria-label="목차와 썸네일 열기">☰</button>
        <!-- 아래 제목을 본인의 책 제목으로 바꾸세요. -->
        <div id="bookTitle">Vakil AG Bearbeitung</div>
      </div>

      <div class="divider optional"></div>

      <div class="group">
        <button id="prevPage" type="button" aria-label="이전 페이지">‹</button>
        <input id="pageInput" type="number" min="1" value="1" aria-label="현재 페이지">
        <span id="pageTotal">/ 0</span>
        <button id="nextPage" type="button" aria-label="다음 페이지">›</button>
      </div>

      <div class="divider"></div>

      <div class="group">
        <button id="zoomOut" type="button" aria-label="축소">−</button>
        <span id="zoomLabel">맞춤</span>
        <button id="zoomIn" type="button" aria-label="확대">＋</button>
        <button id="fitWidth" type="button">폭 맞춤</button>
      </div>

      <div class="divider"></div>

      <div class="group">
        <input id="searchInput" type="search" placeholder="책 안에서 검색" aria-label="책 안에서 검색">
        <button id="searchPrev" type="button" aria-label="이전 검색 결과">↑</button>
        <button id="searchNext" type="button" aria-label="다음 검색 결과">↓</button>
        <span id="searchStatus" class="desktop-only"></span>
      </div>

      <div class="divider"></div>

      <div class="group">
        <a class="tool-button" href="book.pdf" target="_blank" rel="noopener">PDF 열기</a>
      </div>
    </header>

    <div id="content">
      <aside id="sidebar" aria-label="책 탐색">
        <div id="sidebarTabs" role="tablist">
          <button id="thumbTab" type="button" role="tab" aria-selected="true">페이지</button>
          <button id="outlineTab" type="button" role="tab" aria-selected="false">목차</button>
        </div>
        <div id="thumbPanel" class="side-panel" role="tabpanel">
          <div id="thumbs"></div>
        </div>
        <div id="outlinePanel" class="side-panel" role="tabpanel" hidden>
          <div id="outline"><div class="empty">목차를 불러오는 중입니다.</div></div>
        </div>
      </aside>

      <main id="viewerPane" tabindex="0" aria-label="PDF 본문">
        <div id="statusOverlay">PDF를 불러오는 중입니다.</div>
        <div id="pageStage" hidden>
          <canvas id="pdfCanvas"></canvas>
          <div id="textLayer" aria-label="선택 가능한 PDF 텍스트"></div>
        </div>
      </main>

      <button id="mobileShade" type="button" aria-label="사이드바 닫기"></button>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.min.mjs";

    const PDF_URL = "book.pdf";
    const CDN_BASE = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      CDN_BASE + "build/pdf.worker.min.mjs";

    const $ = (id) => document.getElementById(id);

    const elements = {
      body: document.body,
      viewerPane: $("viewerPane"),
      stage: $("pageStage"),
      canvas: $("pdfCanvas"),
      textLayer: $("textLayer"),
      status: $("statusOverlay"),
      sidebarToggle: $("sidebarToggle"),
      mobileShade: $("mobileShade"),
      thumbTab: $("thumbTab"),
      outlineTab: $("outlineTab"),
      thumbPanel: $("thumbPanel"),
      outlinePanel: $("outlinePanel"),
      thumbs: $("thumbs"),
      outline: $("outline"),
      prevPage: $("prevPage"),
      nextPage: $("nextPage"),
      pageInput: $("pageInput"),
      pageTotal: $("pageTotal"),
      zoomOut: $("zoomOut"),
      zoomIn: $("zoomIn"),
      fitWidth: $("fitWidth"),
      zoomLabel: $("zoomLabel"),
      searchInput: $("searchInput"),
      searchPrev: $("searchPrev"),
      searchNext: $("searchNext"),
      searchStatus: $("searchStatus"),
    };

    let pdfDocument = null;
    let currentPage = 1;
    let zoomFactor = 1;
    let renderSerial = 0;
    let resizeTimer = null;
    let searchIndexPromise = null;
    let pageTexts = [];
    let searchMatches = [];
    let searchCursor = -1;
    let activeSearchTerm = "";
    const thumbRendered = new Set();

    function showStatus(message) {
      elements.status.textContent = message;
      elements.status.hidden = false;
    }

    function hideStatus() {
      elements.status.hidden = true;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function setSidebar(open) {
      elements.body.classList.toggle("sidebar-open", open);
    }

    function activatePanel(name) {
      const isThumb = name === "thumbs";
      elements.thumbTab.setAttribute("aria-selected", String(isThumb));
      elements.outlineTab.setAttribute("aria-selected", String(!isThumb));
      elements.thumbPanel.hidden = !isThumb;
      elements.outlinePanel.hidden = isThumb;
    }

    function updateControls() {
      if (!pdfDocument) return;
      elements.pageInput.value = String(currentPage);
      elements.pageTotal.textContent = `/ ${pdfDocument.numPages}`;
      elements.prevPage.disabled = currentPage <= 1;
      elements.nextPage.disabled = currentPage >= pdfDocument.numPages;
      elements.zoomLabel.textContent =
        zoomFactor === 1 ? "맞춤" : `${Math.round(zoomFactor * 100)}%`;

      document.querySelectorAll(".thumb").forEach((button) => {
        button.classList.toggle(
          "active",
          Number(button.dataset.page) === currentPage
        );
      });

      const activeThumb = document.querySelector(
        `.thumb[data-page="${currentPage}"]`
      );
      if (activeThumb && !elements.thumbPanel.hidden) {
        activeThumb.scrollIntoView({ block: "nearest" });
      }
    }

    async function renderPage(pageNumber) {
      if (!pdfDocument) return;

      currentPage = clamp(pageNumber, 1, pdfDocument.numPages);
      updateControls();

      const serial = ++renderSerial;
      showStatus(`${currentPage}쪽을 불러오는 중입니다.`);

      try {
        const page = await pdfDocument.getPage(currentPage);
        if (serial !== renderSerial) return;

        const unscaled = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(
          260,
          elements.viewerPane.clientWidth - 34
        );
        const fitScale = availableWidth / unscaled.width;
        const scale = clamp(fitScale * zoomFactor, 0.2, 5);
        const viewport = page.getViewport({ scale });

        elements.stage.hidden = false;
        elements.stage.style.width = `${viewport.width}px`;
        elements.stage.style.height = `${viewport.height}px`;

        const outputScale = Math.min(window.devicePixelRatio || 1, 2);
        const canvas = elements.canvas;
        const context = canvas.getContext("2d", { alpha: false });

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;

        context.setTransform(1, 0, 0, 1, 0, 0);
        context.clearRect(0, 0, canvas.width, canvas.height);

        const transform =
          outputScale === 1
            ? null
            : [outputScale, 0, 0, outputScale, 0, 0];

        await page.render({
          canvasContext: context,
          viewport,
          transform,
          background: "white",
        }).promise;

        if (serial !== renderSerial) return;

        await renderSelectableText(page, viewport, activeSearchTerm);
        if (serial !== renderSerial) return;

        hideStatus();
        elements.viewerPane.scrollTop = 0;
        updateControls();
        history.replaceState(null, "", `#page=${currentPage}`);
      } catch (error) {
        console.error(error);
        showStatus(
          "이 페이지를 표시하지 못했습니다. 새로고침하거나 PDF 파일을 확인하세요."
        );
      }
    }

    async function renderSelectableText(page, viewport, searchTerm) {
      const layer = elements.textLayer;
      layer.replaceChildren();
      layer.style.width = `${viewport.width}px`;
      layer.style.height = `${viewport.height}px`;

      const textContent = await page.getTextContent();
      const normalizedTerm = searchTerm.trim().toLocaleLowerCase("ko");

      for (const item of textContent.items) {
        if (!item.str) continue;

        const tx = pdfjsLib.Util.transform(
          viewport.transform,
          item.transform
        );
        const angle = Math.atan2(tx[1], tx[0]);
        const fontHeight = Math.hypot(tx[2], tx[3]);
        const span = document.createElement("span");

        span.textContent = item.str;
        span.style.left = `${tx[4]}px`;
        span.style.top = `${tx[5] - fontHeight}px`;
        span.style.fontSize = `${fontHeight}px`;
        span.style.fontFamily =
          textContent.styles[item.fontName]?.fontFamily || "sans-serif";
        span.style.transform = `rotate(${angle}rad)`;

        if (
          normalizedTerm &&
          item.str.toLocaleLowerCase("ko").includes(normalizedTerm)
        ) {
          span.classList.add("search-hit");
        }

        layer.appendChild(span);

        const targetWidth = item.width * viewport.scale;
        const measuredWidth = span.getBoundingClientRect().width;
        if (measuredWidth > 0 && targetWidth > 0) {
          const scaleX = targetWidth / measuredWidth;
          span.style.transform = `rotate(${angle}rad) scaleX(${scaleX})`;
        }
      }
    }

    function createThumbnailShells() {
      elements.thumbs.replaceChildren();

      for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "thumb";
        button.dataset.page = String(pageNumber);
        button.setAttribute("aria-label", `${pageNumber}쪽으로 이동`);

        const canvas = document.createElement("canvas");
        canvas.width = 120;
        canvas.height = 160;

        const label = document.createElement("span");
        label.textContent = `${pageNumber}쪽`;

        button.append(canvas, label);
        button.addEventListener("click", () => {
          renderPage(pageNumber);
          if (window.matchMedia("(max-width: 800px)").matches) {
            setSidebar(false);
          }
        });

        elements.thumbs.appendChild(button);
      }

      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            const pageNumber = Number(entry.target.dataset.page);
            renderThumbnail(pageNumber, entry.target);
            observer.unobserve(entry.target);
          }
        },
        { root: elements.thumbPanel, rootMargin: "300px 0px" }
      );

      document.querySelectorAll(".thumb").forEach((button) => {
        observer.observe(button);
      });
    }

    async function renderThumbnail(pageNumber, button) {
      if (thumbRendered.has(pageNumber)) return;
      thumbRendered.add(pageNumber);

      try {
        const page = await pdfDocument.getPage(pageNumber);
        const base = page.getViewport({ scale: 1 });
        const scale = Math.min(145 / base.width, 195 / base.height);
        const viewport = page.getViewport({ scale });
        const canvas = button.querySelector("canvas");
        const context = canvas.getContext("2d", { alpha: false });
        const outputScale = Math.min(window.devicePixelRatio || 1, 1.5);

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;

        await page.render({
          canvasContext: context,
          viewport,
          transform:
            outputScale === 1
              ? null
              : [outputScale, 0, 0, outputScale, 0, 0],
          background: "white",
        }).promise;
      } catch (error) {
        console.warn(`Thumbnail ${pageNumber} failed`, error);
      }
    }

    async function buildOutline() {
      const outline = await pdfDocument.getOutline();
      elements.outline.replaceChildren();

      if (!outline || outline.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent =
          "이 PDF에는 책갈피 목차가 없습니다. PDF를 만들 때 '책갈피 포함' 또는 '목차를 책갈피로 내보내기' 옵션을 켜야 합니다.";
        elements.outline.appendChild(empty);
        return;
      }

      async function goToDestination(dest) {
        try {
          let destination = dest;
          if (typeof destination === "string") {
            destination = await pdfDocument.getDestination(destination);
          }
          if (!Array.isArray(destination)) return;

          const reference = destination[0];
          let pageIndex;

          if (typeof reference === "object") {
            pageIndex = await pdfDocument.getPageIndex(reference);
          } else {
            pageIndex = Number(reference);
          }

          await renderPage(pageIndex + 1);
          if (window.matchMedia("(max-width: 800px)").matches) {
            setSidebar(false);
          }
        } catch (error) {
          console.warn("목차 이동 실패", error);
        }
      }

      function createList(items) {
        const ul = document.createElement("ul");

        for (const item of items) {
          const li = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = item.title || "제목 없음";

          if (item.url) {
            button.addEventListener("click", () => {
              window.open(item.url, "_blank", "noopener");
            });
          } else {
            button.addEventListener("click", () => goToDestination(item.dest));
          }

          li.appendChild(button);

          if (item.items?.length) {
            li.appendChild(createList(item.items));
          }

          ul.appendChild(li);
        }

        return ul;
      }

      elements.outline.appendChild(createList(outline));
    }

    async function ensureSearchIndex() {
      if (searchIndexPromise) return searchIndexPromise;

      searchIndexPromise = (async () => {
        pageTexts = new Array(pdfDocument.numPages).fill("");

        for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
          elements.searchStatus.textContent =
            `검색 준비 ${pageNumber}/${pdfDocument.numPages}`;

          const page = await pdfDocument.getPage(pageNumber);
          const textContent = await page.getTextContent();
          pageTexts[pageNumber - 1] = textContent.items
            .map((item) => item.str || "")
            .join(" ")
            .replace(/\s+/g, " ");
        }

        elements.searchStatus.textContent = "";
      })();

      return searchIndexPromise;
    }

    async function runSearch(direction = 1, repeat = false) {
      const term = elements.searchInput.value.trim();

      if (!term) {
        activeSearchTerm = "";
        searchMatches = [];
        searchCursor = -1;
        elements.searchStatus.textContent = "";
        await renderPage(currentPage);
        return;
      }

      showStatus("책 전체의 글자를 검색하는 중입니다.");
      await ensureSearchIndex();

      const normalized = term.toLocaleLowerCase("ko");

      if (!repeat || normalized !== activeSearchTerm.toLocaleLowerCase("ko")) {
        activeSearchTerm = term;
        searchMatches = [];

        for (let pageIndex = 0; pageIndex < pageTexts.length; pageIndex++) {
          const haystack = pageTexts[pageIndex].toLocaleLowerCase("ko");
          let start = 0;
          let count = 0;

          while (true) {
            const found = haystack.indexOf(normalized, start);
            if (found === -1) break;
            count += 1;
            start = found + Math.max(1, normalized.length);
          }

          for (let i = 0; i < count; i++) {
            searchMatches.push(pageIndex + 1);
          }
        }

        searchCursor = direction >= 0 ? -1 : 0;
      }

      if (searchMatches.length === 0) {
        hideStatus();
        elements.searchStatus.textContent = "검색 결과 없음";
        return;
      }

      searchCursor =
        (searchCursor + direction + searchMatches.length) %
        searchMatches.length;

      const targetPage = searchMatches[searchCursor];
      elements.searchStatus.textContent =
        `${searchCursor + 1}/${searchMatches.length} · ${targetPage}쪽`;

      await renderPage(targetPage);
    }

    function parseInitialPage() {
      const match = location.hash.match(/page=(\d+)/);
      return match ? Number(match[1]) : 1;
    }

    elements.sidebarToggle.addEventListener("click", () => {
      if (window.matchMedia("(max-width: 800px)").matches) {
        setSidebar(!elements.body.classList.contains("sidebar-open"));
      } else {
        const sidebar = $("sidebar");
        const hidden = sidebar.style.display === "none";
        sidebar.style.display = hidden ? "" : "none";
        $("content").style.gridTemplateColumns = hidden
          ? "var(--sidebar-w) minmax(0, 1fr)"
          : "minmax(0, 1fr)";
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => renderPage(currentPage), 120);
      }
    });

    elements.mobileShade.addEventListener("click", () => setSidebar(false));
    elements.thumbTab.addEventListener("click", () => activatePanel("thumbs"));
    elements.outlineTab.addEventListener("click", () => activatePanel("outline"));

    elements.prevPage.addEventListener("click", () => renderPage(currentPage - 1));
    elements.nextPage.addEventListener("click", () => renderPage(currentPage + 1));

    elements.pageInput.addEventListener("change", () => {
      renderPage(Number(elements.pageInput.value));
    });

    elements.pageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        renderPage(Number(elements.pageInput.value));
      }
    });

    elements.zoomIn.addEventListener("click", () => {
      zoomFactor = clamp(zoomFactor * 1.15, 0.35, 4);
      renderPage(currentPage);
    });

    elements.zoomOut.addEventListener("click", () => {
      zoomFactor = clamp(zoomFactor / 1.15, 0.35, 4);
      renderPage(currentPage);
    });

    elements.fitWidth.addEventListener("click", () => {
      zoomFactor = 1;
      renderPage(currentPage);
    });

    elements.searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        runSearch(event.shiftKey ? -1 : 1, false);
      } else if (event.key === "Escape") {
        elements.searchInput.value = "";
        runSearch();
      }
    });

    elements.searchNext.addEventListener("click", () => runSearch(1, true));
    elements.searchPrev.addEventListener("click", () => runSearch(-1, true));

    elements.viewerPane.addEventListener("keydown", (event) => {
      if (event.key === "PageDown" || event.key === "ArrowRight") {
        event.preventDefault();
        renderPage(currentPage + 1);
      } else if (event.key === "PageUp" || event.key === "ArrowLeft") {
        event.preventDefault();
        renderPage(currentPage - 1);
      }
    });

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderPage(currentPage), 180);
    });

    async function start() {
      try {
        const loadingTask = pdfjsLib.getDocument({
          url: PDF_URL,
          cMapUrl: CDN_BASE + "cmaps/",
          cMapPacked: true,
          standardFontDataUrl: CDN_BASE + "standard_fonts/",
          wasmUrl: CDN_BASE + "wasm/",
          iccUrl: CDN_BASE + "iccs/",
          imageResourcesPath: CDN_BASE + "web/images/",
          enableXfa: true,
        });

        loadingTask.onProgress = ({ loaded, total }) => {
          if (total) {
            const percent = Math.round((loaded / total) * 100);
            showStatus(`PDF를 불러오는 중입니다. ${percent}%`);
          }
        };

        pdfDocument = await loadingTask.promise;
        elements.pageTotal.textContent = `/ ${pdfDocument.numPages}`;
        elements.pageInput.max = String(pdfDocument.numPages);

        createThumbnailShells();
        buildOutline().catch(console.error);
        await renderPage(parseInitialPage());
      } catch (error) {
        console.error(error);
        showStatus(
          "book.pdf를 찾지 못했거나 PDF를 열 수 없습니다. index.html과 book.pdf가 같은 위치에 있는지 확인하세요."
        );
      }
    }

    start();
  </script>
</body>
</html>
