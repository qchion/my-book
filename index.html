<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>온라인 책</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #525659;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
    }

    #desktopViewer {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #mobileFallback {
      display: none;
      min-height: 100%;
      padding: 24px;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      color: #111;
      text-align: center;
    }

    .card {
      width: min(100%, 420px);
      padding: 28px 22px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    p {
      margin: 0 0 20px;
      line-height: 1.6;
      color: #555;
    }

    a {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      background: #111;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 820px) {
      #desktopViewer { display: none; }
      #mobileFallback { display: flex; }
    }
  </style>
</head>
<body>
  <iframe
    id="desktopViewer"
    src="book.pdf#page=1&zoom=page-width"
    title="온라인 PDF 책">
  </iframe>

  <main id="mobileFallback">
    <div class="card">
      <h1>책을 여는 중입니다</h1>
      <p>
        모바일에서는 전체 페이지와 화면 맞춤을 위해
        PDF를 Safari의 전체 화면 뷰어로 엽니다.
      </p>
      <a href="book.pdf">책 열기</a>
    </div>
  </main>

  <script>
    (function () {
      const ua = navigator.userAgent || "";
      const isIOS =
        /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const isSmallTouchScreen =
        window.matchMedia("(max-width: 820px) and (pointer: coarse)").matches;

      if (isIOS || isSmallTouchScreen) {
        window.location.replace("book.pdf");
      }
    })();
  </script>
</body>
</html>
